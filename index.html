<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>G.Cole Rotation Optimizer</title>
<meta name="description" content="Fair 3-shift station rotation from your team skills. Data stays on this device.">
<meta name="theme-color" content="#12161b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="G.Cole Rotation Optimizer">

<style>
:root {
  --canvas: #12161b;
  --panel: #1b2129;
  --panel-2: #222a33;
  --line: #2c3540;
  --ink: #e8ecef;
  --muted: #8b96a3;
  --good: #33c97a;
  --good-dim: #1e5c3c;
  --action: #4fa8ff;
  --action-dim: #1e4a6e;
  --action-fg: #dceeff;
  --bad: #e07a7a;
  --bad-dim: #4a2020;
  --bad-fg: #ffc9c9;
  --warn: #e8a33d;
  --warn-dim: #4a3818;
  --warn-fg: #f5ddae;
  --font: "Segoe UI", "Avenir Next", "Helvetica Neue", sans-serif;
  --heading: "Avenir Next", "Segoe UI", sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--canvas); color: var(--ink); font-family: var(--font); font-size: 16px; line-height: 1.45; }
button, [role="button"] { font: inherit; color: inherit; cursor: pointer; }
button:disabled { cursor: default; opacity: 0.5; }
h2 { margin: 0 0 8px; font-family: var(--heading); font-size: 12px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
p { margin: 0; }
b { font-weight: 600; }
.wrap { width: min(48rem, 100%); margin: 0 auto; }
.top { position: sticky; top: 0; z-index: 20; border-bottom: 1px solid var(--line); background: color-mix(in srgb, var(--canvas) 94%, transparent); backdrop-filter: blur(10px); padding: 4px 12px 8px; }
.brand { margin: 0; text-align: right; font-size: 12px; color: var(--muted); }
.zonebar { display: flex; align-items: center; justify-content: flex-end; gap: 8px; }
.zonebar label { font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.zonebar select { max-width: 9.5rem; background: transparent; color: var(--muted); border: 1px solid var(--line); border-radius: 6px; font: inherit; font-size: 12px; padding: 2px 6px; }
.zone-new { min-height: 32px; border: 0; background: transparent; color: var(--muted); font-size: 12px; text-decoration: underline; text-underline-offset: 2px; padding: 0 2px; }
.zone-add { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
.zone-add .field { min-height: 40px; }
.tabs { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin-top: 4px; }
.tab { min-height: 44px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; border: 1px solid transparent; border-radius: 8px; background: transparent; color: var(--muted); font-size: 12px; font-weight: 600; padding: 2px; }
.tab.on { border-color: var(--action); background: var(--action-dim); color: var(--action-fg); }
.ico { width: 16px; height: 16px; }
.main { padding: 12px 12px 28px; }
.stack { display: flex; flex-direction: column; gap: 12px; }
.stack.tight { gap: 8px; }
.card { border: 1px solid var(--line); background: var(--panel); border-radius: 12px; padding: 12px; }
.card.flush { padding: 0; overflow: hidden; }
.card.off { border-color: color-mix(in srgb, var(--bad) 50%, var(--line)); }
.muted { color: var(--muted); font-size: 14px; }
.fine { color: var(--muted); font-size: 12px; padding: 8px 12px 12px; }
.card > .fine { padding: 0; margin-top: 8px; }
.bad { color: var(--bad-fg); font-size: 14px; }
.warn-text { color: var(--warn-fg); font-size: 14px; }
.ink { color: var(--ink); }
.action { color: var(--action); }
.good { color: var(--good); }
.warn { color: var(--warn); }
.pad { padding: 16px; }
.kicker { margin: 0 0 4px; font-family: var(--heading); font-size: 11px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
.kicker.tight { margin: 0; }
.kicker.gap, .gap { margin-top: 12px; }
.btn { min-height: 44px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; border-radius: 12px; border: 1px solid var(--line); background: var(--panel-2); color: var(--ink); padding: 8px 12px; font-size: 14px; font-weight: 600; }
.btn:active:not(:disabled) { transform: scale(0.98); }
.btn.primary { border-color: var(--action); background: var(--action-dim); color: var(--action-fg); }
.btn.danger { border-color: var(--bad); background: var(--bad-dim); color: var(--bad-fg); }
.btn.block { width: 100%; }
.dot { display: inline-block; width: 4px; height: 4px; margin-right: 4px; border-radius: 999px; background: var(--muted); vertical-align: middle; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.span2 { grid-column: span 2; }
.days { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; }
.day { min-height: 44px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel-2); color: var(--muted); font-size: 14px; font-weight: 600; }
.day.on { border-color: var(--action); background: var(--action-dim); color: var(--action-fg); }
.day.idle { display: grid; place-items: center; font-size: 12px; }
.check { display: flex; align-items: center; gap: 8px; min-height: 44px; font-size: 14px; }
.check.small { min-height: 0; font-size: 12px; color: var(--muted); margin: 0; }
.field { width: 100%; min-height: 44px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel-2); color: var(--ink); padding: 10px 12px; font: inherit; }
.field:focus { outline: none; border-color: var(--action); }
.area { min-height: 112px; resize: vertical; }
.status { min-height: 20px; font-size: 14px; color: var(--muted); }
.status.ok { color: var(--good); }
.status.err { color: var(--bad); }
.status.busy { color: var(--action); }
.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.stats.half { grid-template-columns: 1fr 1fr; }
.stat { border: 1px solid var(--line); background: var(--panel-2); border-radius: 12px; padding: 10px 12px; }
.stat-n { font-family: var(--heading); font-size: 28px; line-height: 1; font-weight: 700; }
.stat-n.good { color: var(--good); }
.stat-n.warn { color: var(--warn); }
.stat-l { margin-top: 4px; font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
.spares { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.spare { border: 1px solid var(--line); background: var(--panel-2); border-radius: 12px; padding: 8px; }
.spare p { margin-top: 4px; font-size: 14px; line-height: 1.35; }
.row { display: flex; align-items: center; gap: 8px; }
.row.spread { justify-content: space-between; align-items: baseline; padding: 12px 12px 0; }
.card > .row.spread { padding: 0; margin-bottom: 8px; }
.scroll { max-height: 50vh; overflow: auto; overflow-anchor: none; -webkit-overflow-scrolling: touch; }
.matrix-scroll { max-height: 62vh; border: 1px solid var(--line); border-radius: 12px; }
table { border-collapse: collapse; width: 100%; }
.rota { text-align: left; font-size: 12px; }
.rota thead th { position: sticky; top: 0; background: var(--panel-2); color: var(--muted); text-transform: uppercase; text-align: left; padding: 8px; }
.rota tbody th { padding: 8px; font-weight: 600; text-align: left; border-top: 1px solid var(--line); }
.rota td { border-top: 1px solid var(--line); padding: 0; }
.slot-btn { min-height: 44px; width: 100%; text-align: left; background: transparent; border: 0; padding: 8px; overflow-wrap: anywhere; }
.slot.empty .slot-btn { color: var(--muted); }
.slot.warn { background: color-mix(in srgb, var(--warn) 30%, transparent); color: var(--warn-fg); }
.slot.bad { background: color-mix(in srgb, var(--bad) 35%, transparent); color: var(--bad-fg); }
.five { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; }
.mini { min-height: 44px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel-2); color: var(--muted); font-size: 12px; font-weight: 600; }
.mini.on { border-color: var(--action); background: var(--action-dim); color: var(--action-fg); }
.mini.block { border-color: var(--warn); background: var(--warn-dim); color: var(--warn-fg); }
.mini.off { border-color: var(--bad); background: var(--bad-dim); color: var(--bad-fg); }
.matrix { border-collapse: separate; border-spacing: 0; width: max-content; min-width: 100%; font-size: 12px; }
.matrix th, .matrix td { border-top: 1px solid var(--line); }
.matrix thead th { position: sticky; top: 0; z-index: 2; background: var(--panel-2); color: var(--muted); padding: 8px 4px; text-align: center; }
.matrix .sticky { position: sticky; left: 0; z-index: 1; background: var(--panel); min-width: 148px; text-align: left; }
.matrix thead .sticky { z-index: 3; background: var(--panel-2); }
.name { width: 140px; background: transparent; border: 0; color: var(--ink); font: inherit; padding: 8px; }
.name:focus { outline: none; }
.cell { width: 44px; height: 44px; display: grid; place-items: center; background: transparent; border: 0; padding: 0; cursor: pointer; touch-action: manipulation; }
.mark { width: 24px; height: 24px; border-radius: 4px; display: grid; place-items: center; }
.mark .ico { width: 14px; height: 14px; }
.mark.empty { border: 1px solid var(--line); background: var(--panel-2); }
.mark.good { background: var(--good); color: var(--canvas); }
.mark.warn { background: var(--warn); color: var(--canvas); font-size: 12px; font-weight: 700; }
.mark.bad { background: var(--bad); color: var(--bad-fg); }
.pair { display: grid; grid-template-columns: 1fr auto; gap: 8px; margin-top: 8px; }
.pair:first-of-type { margin-top: 0; }
.station { font-family: var(--heading); font-size: 18px; }
.pill { margin-left: auto; border-radius: 999px; padding: 4px 8px; font-size: 12px; font-weight: 600; }
.pill.ok { background: var(--good-dim); color: var(--good); }
.pill.tight { background: var(--warn-dim); color: var(--warn-fg); }
.pill.critical { background: var(--bad-dim); color: var(--bad-fg); }
.pill.none { background: var(--bad); color: var(--canvas); }
ul { margin: 0; padding: 0; list-style: none; }
.help { margin: 0; padding-left: 20px; color: var(--muted); font-size: 14px; display: flex; flex-direction: column; gap: 8px; }
.banner { display: flex; align-items: center; gap: 8px; border-radius: 12px; padding: 8px 12px; margin-bottom: 12px; font-size: 14px; }
.banner.warn { border: 1px solid var(--warn); background: var(--warn-dim); color: var(--warn-fg); }
.banner.hint { border: 1px solid var(--action); background: var(--action-dim); color: var(--action-fg); }
.banner p { flex: 1; }
.icon-btn { width: 44px; height: 44px; display: grid; place-items: center; background: transparent; border: 0; color: inherit; }
.sheet-back { position: fixed; inset: 0; z-index: 40; background: rgba(0, 0, 0, 0.6); display: flex; align-items: flex-end; }
.sheet { width: 100%; max-height: 85vh; overflow: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 16px 16px 0 0; padding: 16px 16px 24px; }
.who { margin-bottom: 12px; font-size: 14px; }
.choice { width: 100%; min-height: 44px; display: flex; align-items: center; justify-content: space-between; gap: 8px; text-align: left; border-radius: 12px; border: 1px solid var(--line); background: var(--panel-2); padding: 8px 12px; font-size: 14px; }
.train-line { font-size: 14px; }
.week { font-size: 14px; }
.week th { background: var(--panel-2); color: var(--muted); font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase; text-align: left; padding: 8px 12px; }
.week td { border-top: 1px solid var(--line); padding: 8px 12px; }
.link { min-height: 44px; background: none; border: 0; padding: 0; font-weight: 600; text-align: left; text-decoration: underline; text-underline-offset: 3px; text-decoration-color: var(--line); }
.detail td { background: var(--panel-2); }
.jobs { display: flex; flex-direction: column; gap: 4px; }
.jobs li { display: flex; justify-content: space-between; gap: 12px; font-size: 14px; }
.truncate { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
@media (max-width: 420px) {
  .spares { grid-template-columns: 1fr; }
}
@media (prefers-reduced-motion: reduce) {
  .btn:active:not(:disabled) { transform: none; }
}

</style>

function mergeZones(saved, fallback) {
  const used = new Set();
  const zones = [];
  for (const preset of ZONE_PRESETS) {
    const found = saved.find((zone) => zone.id === preset.id) || saved.find((zone) => zone.name.toLowerCase() === preset.name.toLowerCase());
    if (found) {
      used.add(found.id);
      zones.push({ id: preset.id, name: preset.name, data: found.data });
    } else if (preset.id === "trim-4") {
      zones.push({ id: preset.id, name: preset.name, data: fallback });
    } else {
      zones.push({ id: preset.id, name: preset.name, data: emptyZoneData() });
    }
  }
  for (const zone of saved) {
    if (used.has(zone.id)) continue;
    if (ZONE_PRESETS.some((preset) => preset.name.toLowerCase() === zone.name.toLowerCase())) continue;
    zones.push(zone);
  }
  return zones;
}

function loadZoneBook(fallback) {
  let saved = [];
  let active = "trim-4";
  try {
    const raw = localStorage.getItem(KEY_ZONES);
    if (raw) {
      const parsed = JSON.parse(raw);
      for (const zone of parsed.zones || []) {
        if (!zone || typeof zone.id !== "string" || !zone.id) continue;
        saved.push({
          id: zone.id,
          name: String(zone.name || "Zone").slice(0, 40),
          data: E(zone.data),
        });
      }
      if (typeof parsed.active === "string") active = parsed.active;
    }
  } catch {
    saved = [];
    active = "trim-4";
  }
  const zones = mergeZones(saved, fallback);
  if (!zones.some((zone) => zone.id === active)) {
    const previous = saved.find((zone) => zone.id === active);
    const match = previous && zones.find((zone) => zone.name.toLowerCase() === previous.name.toLowerCase());
    active = match ? match.id : "trim-4";
  }
  return { active, zones };
}

async function runSolve() {
  const token = ++solveGen;
  ui.solving = true;
  setMsg("Solving…", "busy");
  render();
  await new Promise((r) => setTimeout(r, 30));
  try {
    const data = state.data;
    const n = Math.floor(Math.random() * 1e6);
    const yesterday = data.avoidYesterdayEnabled ? ae(data) : null;
    const worked = ie(data);
    let best = null;
    let bestTrain = K(data.operators, data.stations, data.pins);
    let bestSeats = -1;
    for (let r = 0; r < 40; r++) {
      const seed = (n * 100003 + r * 7919) >>> 0;
      const train = K(data.operators, data.stations, data.pins, r === 0 ? undefined : seed);
      const ops = data.operators.map((person) => {
        const shifts = train.seats.filter((seat) => seat.name === person.name).map((seat) => seat.shift);
        if (!shifts.length) return person;
        return {
          ...person,
          b1: person.b1 || shifts.includes(1),
          b2: person.b2 || shifts.includes(2),
          b3: person.b3 || shifts.includes(3),
        };
      });
      const solved = je(ops, data.stations, worked, seed, yesterday, data.pins);
      const seats = train.seats.length;
      if (!best || seats > bestSeats || (seats === bestSeats && solved.score < best.score)) {
        best = solved;
        bestTrain = train;
        bestSeats = seats;
      }
      if (token !== solveGen) return;
      if (r % 4 === 3) {
        setMsg(`Solving… ${r + 1}/40`, "busy");
        render();
        await new Promise((res) => setTimeout(res, 0));
      }
    }
    if (token !== solveGen || !best) return;
    const stats = J(best.result, best.stations, best.available);
    remember();
    ui.picker = null;
    const gaps = stats.gaps.length;
    setMsg(
      bestTrain.warning
        ? bestTrain.warning
        : gaps
          ? `Solved. ${gaps} slot${gaps === 1 ? "" : "s"} still open.`
          : "Solved.",
      bestTrain.warning ? "err" : gaps ? "" : "ok",
    );
    ui.solving = false;
    setSolve({
      ...best,
      stats,
      training: bestTrain.seats,
      trainingKey: ye(data.operators),
      trainingWarning: bestTrain.warning,
    });
  } catch (err) {
    if (token !== solveGen) return;
    ui.solving = false;
    setMsg(err instanceof Error ? err.message : "Solve failed.", "err");
    render();
  }
}

async function runCover() {
  const current = state.solve;
  if (!current) {
    setMsg("Solve a rotation first.", "");
    render();
    return;
  }
  const token = ++solveGen;
  ui.solving = true;
  setMsg("Covering the gaps…", "busy");
  render();
  await new Promise((r) => setTimeout(r, 30));
  try {
    const data = state.data;
    const train = K(data.operators, data.stations, data.pins);
    const ops = data.operators.map((person) => {
      const shifts = train.seats.filter((seat) => seat.name === person.name).map((seat) => seat.shift);
      if (!shifts.length) return person;
      return {
        ...person,
        b1: person.b1 || shifts.includes(1),
        b2: person.b2 || shifts.includes(2),
        b3: person.b3 || shifts.includes(3),
      };
    });
    const solved = We(ops, data.stations, current.result, data.pins);
    if (token !== solveGen) return;
    let kept = 0;
    let placed = 0;
    let moved = 0;
    const changed = [];
    for (const station of current.stations) {
      for (const shift of [1, 2, 3]) {
        const before = D(current.result[station], shift);
        const after = D(solved.result[station], shift);
        if (before !== after) changed.push(`${station}|${shift}`);
        if (before && before === after) kept++;
        else if (after) {
          const cameFrom = current.stations.some((other) => other !== station && D(current.result[other], shift) === after);
          if (cameFrom) moved++;
          else placed++;
        }
      }
    }
    remember();
    const next = structuredClone(state.data);
    next.pins = next.pins.filter((pin) => {
      const person = next.operators.find((op) => op.name === pin.operator);
      return !!person && person.reg && !person.offline;
    });
    state.data = next;
    if (token !== solveGen) return;
    const stats = J(solved.result, solved.stations, solved.available);
    ui.picker = null;
    const gaps = stats.gaps.length;
    setMsg(
      [
        `Kept ${kept} seat${kept === 1 ? "" : "s"}.`,
        placed ? `Put ${placed} free ${placed === 1 ? "person" : "people"} on the open jobs.` : "",
        moved ? `Moved ${moved} so a gap could be covered.` : "",
        gaps ? `${gaps} slot${gaps === 1 ? "" : "s"} still open.` : "",
        train.warning,
      ].filter(Boolean).join(" "),
      train.warning || gaps ? "err" : "ok",
    );
    ui.solving = false;
    setSolve({
      ...solved,
      stats,
      training: train.seats,
      trainingKey: ye(data.operators),
      trainingWarning: train.warning,
      changed,
    });
  } catch (err) {
    if (token !== solveGen) return;
    ui.solving = false;
    setMsg(err instanceof Error ? err.message : "Could not cover that.", "err");
    render();
  }
}

  if (multi) {

        const names = new Set();
        for (const st of current.stations) {

            if (name) names.add(name);
          }

        unknown.length ? "" : "ok",
      );
    } catch (err) {
      setMsg(err instanceof Error ? err.message : "Could not paste that.", "err");

  }

}

    else if (state.tab === "week") body = viewWeek();
    else if (state.tab === "cover") body = viewCover();
    else if (state.tab === "train") body = viewTrain();
    else if (state.tab === "help") body = viewHelp();
    else body = viewData();
  }
  const warn = state.ready && !state.storageOk
    ? `<p class="banner warn">Browser storage is blocked. Use Save file after every change.</p>`
    : "";
  const hint = state.ready && state.hintOn
    ? `<div class="banner hint"><p>Add to Home Screen from the browser menu so this opens full screen. Then tap Solve.</p><button type="button" class="icon-btn" aria-label="Dismiss hint" data-act="dismiss-hint">${icon("x")}</button></div>`
    : "";
  return `<header class="top"><div class="wrap"><div class="zonebar"><label for="zone">Zone</label><select id="zone" data-field="zone" aria-label="Zone">${zones}</select><button type="button" class="zone-new" data-act="zone-new">${ui.zoneOpen ? "Close" : "New"}</button><p class="brand">G.Cole</p></div>${zoneAdd}<div class="tabs" role="tablist" aria-label="Sections">${nav}</div></div></header><main class="wrap main">${warn}${hint}${body}</main>${overlays()}`;
}

function stat(n, label, tone) {
  return `<div class="stat"><div class="stat-n ${tone || ""}">${esc(n)}</div><div class="stat-l">${esc(label)}</div></div>`;
}

function statusLine(text, tone) {

}

function viewRota() {
  const data = state.data;
  const day = data.selectedDay || "mon";
  const days = S.map((id) => `<button type="button" data-act="day" data-day="${id}" class="day${id === day ? " on" : ""}" aria-pressed="${id === day}">${esc(N(id).slice(0, 3))}</button>`).join("");
  const live = K(data.operators, data.stations, data.pins);
  const key = ye(data.operators);
  const savedTrain = state.solve && state.solve.trainingKey === key && state.solve.training ? state.solve.training : null;
  const seats = savedTrain || live.seats;
  const warning = savedTrain ? (state.solve.trainingWarning || "") : live.warning;
  const grouped = new Map();
  for (const seat of seats) {
    const list = grouped.get(seat.name) || [];
    list.push(seat);
    grouped.set(seat.name, list);
  }
  let trainBox = "";
  if (seats.length || warning) {
    const lines = [...grouped].map(([name, list]) => {
      const byStation = new Map();
      for (const seat of list) {
        const shifts = byStation.get(seat.station) || [];
        shifts.push(seat.shift);
        byStation.set(seat.station, shifts);
      }
      const text = [...byStation].map(([station, shifts]) => `${station} ${shifts.sort((a, b) => a - b).map((n) => `S${n}`).join(", ")}`).join(", ");
      return `<p class="train-line"><b>${esc(name)}</b> <span class="muted">${esc(text)}</span></p>`;
    }).join("");
    trainBox = `<div class="card tight">${seats.length ? `<p class="kicker">Training</p>${lines}` : ""}${warning ? `<p class="bad">${esc(warning)}</p>` : ""}</div>`;
  }
  const board = boardNow();
  const offline = data.operators.filter((person) => person.offline).length;
  const inn = ce(data).length;
  const short = se(data).filter((row) => row.risk !== "ok");
  const cover = short.length ? ` Tight cover: ${short.map((row) => row.station).join(", ")}.` : " Cover looks comfortable.";
  let stats = "";
  if (board.stats && board.stats.filled > 0) {
    const spares = [1, 2, 3].map((shift) => {
      const names = board.stats.extra[shift].slice();
      for (const seat of seats) {
        if (seat.shift === shift && !names.includes(seat.name)) names.push(seat.name);
      }
      const label = names.map((name) => {
        const seat = seats.find((item) => item.name === name && item.shift === shift);
        return seat ? `${name} ${seat.station}` : name;
      }).join(", ");
      return `<div class="spare"><div class="kicker tight">S${shift} spare</div><p>${esc(label || "None")}</p></div>`;
    }).join("");
    const pct = Math.round((board.stats.filled / Math.max(board.stats.total, 1)) * 100);
    stats = `<div class="spares" data-testid="spares">${spares}</div><div class="stats">${
      stat(`${board.stats.overall}%`, "Overall rotation", board.stats.overall >= 80 ? "good" : "warn")
    }${stat(String(board.stats.bucket[3] || 0), "3-job people")}${
      stat(String(board.stats.stuckMulti.length), "Stuck multi-skill", board.stats.stuckMulti.length ? "warn" : "good")
    }${stat(`${pct}%`, `Slots ${board.stats.filled}/${board.stats.total}`, board.stats.filled === board.stats.total ? "good" : "warn")}</div>${
      board.stats.stuckMulti.length ? `<p class="warn-text">Multi-skill but only one station: ${esc(board.stats.stuckMulti.join(", "))}</p>` : ""
    }`;
  }
  const changed = new Set(state.solve && state.solve.changed ? state.solve.changed : []);
  const rows = board.stations.filter((station) => {
    if (!ui.issuesOnly) return true;
    const names = [1, 2, 3].map((shift) => D(board.result[station], shift) || "");
    const counts = {};
    names.forEach((name) => { if (name) counts[name] = (counts[name] || 0) + 1; });
    return Object.values(counts).some((n) => n >= 2) || names.some((name) => !name) || [1, 2, 3].some((shift) => changed.has(`${station}|${shift}`));
  });
  const bodyRows = rows.map((station) => {
    const names = [1, 2, 3].map((shift) => D(board.result[station], shift) || "");
    const counts = {};
    names.forEach((name) => { if (name) counts[name] = (counts[name] || 0) + 1; });
    const cells = names.map((name, index) => {
      const shift = index + 1;
      const changedCell = changed.has(`${station}|${shift}`);
      const pinned = !!name && data.pins.some((pin) => pin.operator === name && pin.station === station && pin.shifts.includes(shift));
      const tone = !name ? "empty" : counts[name] >= 3 ? "bad" : counts[name] === 2 ? "warn" : "";
      const mark = changedCell ? `<span class="dot" aria-hidden="true"></span>` : "";
      const shown = name ? `${mark}${esc(name)}${pinned ? " *" : ""}` : (changedCell ? mark : "—");
      return `<td class="slot ${tone}"><button type="button" class="slot-btn" data-act="slot" data-station="${esc(station)}" data-shift="${shift}" aria-label="${esc(station)} shift ${shift}, ${esc(name || "empty")}${pinned ? ", pinned" : ""}${changedCell ? ", changed" : ""}. Paste or change">${shown}</button></td>`;
    }).join("");
    return `<tr><th>${esc(station)}</th>${cells}</tr>`;
  }).join("");
  const empty = rows.length === 0 ? `<tr><td colspan="4" class="muted pad">No repeats or empty slots.</td></tr>` : "";
  return `<div class="stack">
    <div class="days">${days}</div>
    ${trainBox}
    <button type="button" class="btn primary block" data-testid="solve" data-act="solve" ${ui.solving ? "disabled" : ""}>${ui.solving ? "Solving…" : "Solve rotation"}</button>
    <button type="button" class="btn block" data-testid="repair" data-act="cover" ${ui.solving || !state.solve ? "disabled" : ""}>Cover absence</button>
    <div class="grid2">
      <button type="button" class="btn" data-act="solve" ${ui.solving ? "disabled" : ""}>Reshuffle</button>
      <button type="button" class="btn" data-testid="back" data-act="back" ${ui.solving || history.length === 0 ? "disabled" : ""}>${history.length ? `Back (${history.length})` : "Back"}</button>
      <button type="button" class="btn span2" data-act="clear">Clear result</button>
    </div>
    <label class="check"><input type="checkbox" data-act="avoid" ${data.avoidYesterdayEnabled ? "checked" : ""}> Avoid yesterday's stations</label>
    ${statusLine(ui.rotaMsg, ui.rotaTone)}
    <p class="muted">${inn} in · ${offline} offline · ${data.stations.length} stations.${esc(cover)}</p>
    ${stats}
    <section class="card flush">
      <div class="row spread">
        <h2>Today's rota</h2>
        <label class="check small"><input type="checkbox" data-act="issues" ${ui.issuesOnly ? "checked" : ""}> Issues only</label>
      </div>
      ${changed.size ? `<p class="fine">A small dot marks a name that changed.</p>` : ""}
      <div class="scroll" data-paste="rota">
        <table class="rota" data-testid="result-table">
          <thead><tr><th>Stn</th><th>S1</th><th>S2</th><th>S3</th></tr></thead>
          <tbody>${bodyRows}${empty}</tbody>
        </table>
      </div>
      <p class="fine">Copy the operator sheet in Excel, tap a slot here, then paste. The names land on the matching stations and stay pinned. Tap a slot to pick a name by hand. A star is a pin.</p>
    </section>
    <div class="grid2">
      <button type="button" class="btn" data-act="copy-excel">Copy for Excel</button>
      <button type="button" class="btn" data-act="copy-message">Copy message</button>
    </div>
    ${board.stats && board.stats.filled > 0 ? `<button type="button" class="btn primary block" data-act="open-confirm">Confirm date</button>` : ""}
  </div>`;
}

function overlays() {
  let html = "";
  if (ui.picker && state.tab === "rota") {
    const data = state.data;
    const board = boardNow();
    const station = ui.picker.station;
    const shift = ui.picker.shift;
    const current = D(board.result[station], shift);
    const placed = [];
    for (const st of board.stations) {
      const name = D(board.result[st], shift);
      if (name) placed.push({ name, station: st });
    }
    const taken = new Set(data.pins.filter((pin) => pin.station !== station && pin.shifts.includes(shift)).map((pin) => pin.operator));
    const options = data.operators
      .filter((person) => person.reg && !person.offline && person.name !== current)
      .filter((person) => !k(person, shift) && A(person, station) && !taken.has(person.name))
      .map((person) => ({ name: person.name, at: (placed.find((row) => row.name === person.name) || {}).station || null }))
      .sort((a, b) => a.name.localeCompare(b.name));
    const pinned = !!current && data.pins.some((pin) => pin.operator === current && pin.station === station && pin.shifts.includes(shift));
    html += `<div class="sheet-back" data-act="close-picker" role="dialog" aria-modal="true" aria-label="Change ${esc(station)} shift ${shift}"><div class="sheet" data-act="stop">
      <h2>${esc(station)} · S${shift}</h2>
      <p class="who">${esc(current || "Empty")}${pinned ? ` <span class="action">· pinned</span>` : ""}</p>
      ${current ? `<button type="button" class="btn danger block" data-act="clear-slot">Clear slot</button>` : ""}
      <p class="kicker gap">Who can do this</p>
      <div class="stack tight">${options.map((person) => `<button type="button" class="choice" data-act="pin" data-name="${esc(person.name)}"><b>${esc(person.name)}</b>${person.at ? `<span class="muted">On ${esc(person.at)}</span>` : ""}</button>`).join("") || `<p class="muted">No one free who can do this job.</p>`}</div>
      <button type="button" class="btn block gap" data-act="close-picker">Close</button>
    </div></div>`;
  }
  if (ui.confirmOpen && state.tab === "rota") {
    html += `<div class="sheet-back" role="dialog" aria-modal="true" aria-label="Confirm this rotation"><div class="sheet" data-act="stop">
      <h2>Confirm this rotation</h2>
      <input class="field" type="date" data-focus="confirm-date" data-field="confirm-date" value="${esc(ui.confirmDate)}">
      <div class="grid2 gap">
        <button type="button" class="btn" data-act="close-confirm">Cancel</button>
        <button type="button" class="btn primary" data-act="confirm">Confirm</button>
      </div>
    </div></div>`;
  }
  return html;
}

function sessionButton(person, index) {
  const active = person.reg && !person.offline;
  const sessions = person.trainSessions || 0;
  const label = active && sessions > 0 ? `T${sessions}` : "In";
  const cls = active ? (sessions > 0 ? "block" : "on") : "";
  return `<button type="button" class="mini ${cls}" data-act="sessions" data-i="${index}" aria-pressed="${active}" aria-label="${label === "In" ? "In" : `Training ${sessions} session${sessions === 1 ? "" : "s"}`}">${label}</button>`;
}

function flagButton(index, key, on, label, kind) {
  return `<button type="button" class="mini ${on ? kind : ""}" data-act="flag" data-i="${index}" data-k="${key}" aria-pressed="${on}">${label}</button>`;
}

function mark(kind) {
  if (kind === "qualified") return `<span class="mark good">${icon("check")}</span>`;
  if (kind === "training") return `<span class="mark warn">T</span>`;
  if (kind === "blocked") return `<span class="mark bad">${icon("x")}</span>`;
  return `<span class="mark empty"></span>`;
}

function viewWeek() {
  const data = state.data;
  const summary = re(data);
  const archiveKeys = Object.keys(data.weekArchive || {}).sort().reverse();
  let body;
  if (!summary.solved.length) {
    body = `<section class="card"><p class="muted">No rotas yet. Solve Monday to Friday on the Rota page.</p></section>`;
  } else {
    let known = 0;
    let done = 0;
    const people = Object.keys(summary.worked).map((name) => {
      const person = data.operators.find((item) => item.name === name);
      const skills = person ? Object.keys(person.quals).filter((station) => person.quals[station] && !(person.blocked && person.blocked[station])) : [];
      const used = (summary.worked[name] || []).filter((station) => skills.includes(station));
      const listed = skills.map((station) => ({ station, times: (summary.counts[name] && summary.counts[name][station]) || 0 }))
        .sort((a, b) => b.times - a.times || a.station.localeCompare(b.station));
      known += skills.length;
      done += used.length;
      return {
        name,
        k: skills.length,
        c: used.length,
        pct: skills.length ? Math.round((used.length / skills.length) * 100) : 0,
        listed,
      };
    }).sort((a, b) => data.operators.findIndex((person) => person.name === a.name) - data.operators.findIndex((person) => person.name === b.name));
    const fair = known ? Math.round((done / known) * 100) : 0;
    const days = S.map((id) => `<div class="day ${summary.solved.includes(id) ? "on" : "idle"}">${esc(N(id).slice(0, 3))}</div>`).join("");
    const rows = people.map((person) => {
      const open = ui.weekOpen === person.name;
      const detail = open ? `<tr class="detail"><td colspan="4">${person.listed.length === 0 ? `<p class="muted">No jobs listed.</p>` : `<ul class="jobs">${person.listed.map((job) => `<li><span>${esc(job.station)}</span><span class="${job.times === 0 ? "muted" : ""}">${job.times === 0 ? "Not been on" : `${job.times} time${job.times === 1 ? "" : "s"}`}</span></li>`).join("")}</ul>`}</td></tr>` : "";
      return `<tr><td><button type="button" class="link" data-act="week-name" data-name="${esc(person.name)}" aria-expanded="${open}">${esc(person.name)}</button></td><td>${person.k}</td><td>${person.c}</td><td class="${person.pct >= 70 ? "good" : person.k ? "warn" : "muted"}">${person.k ? `${person.pct}%` : "—"}</td></tr>${detail}`;
    }).join("");
    body = `<div class="stats half">${stat(`${fair}%`, "Weekly fairness", fair >= 70 ? "good" : "warn")}${stat(`${summary.solved.length}/5`, "Days solved")}</div>
      <div class="days">${days}</div>
      <div class="scroll"><table class="week"><thead><tr><th>Operator</th><th>Known</th><th>Done</th><th>%</th></tr></thead><tbody>${rows}</tbody></table></div>`;
  }
  const archive = archiveKeys.length ? `<section class="card"><h2>Archived weeks</h2><ul class="stack tight">${archiveKeys.map((key) => {
    const item = data.weekArchive[key];
    const count = Object.keys(item.weekHistory || {}).length;
    const [from, to] = key.split("_to_");
    return `<li><span class="ink">${esc(ne(from))} – ${esc(ne(to))}</span> <span class="muted">· ${count} day${count === 1 ? "" : "s"}</span></li>`;
  }).join("")}</ul></section>` : "";
  return `<div class="stack"><section class="card"><h2>This week</h2><p class="muted">Fairness from the Monday to Friday rotas. Nothing needs confirming.</p></section>${body}${archive}</div>`;
}

function viewData() {
  const paste = ui.dataPasteOpen ? `<div class="stack tight">
    <p class="muted">Header row must include Name, then Reg, Offline, 1st, 2nd, 3rd, then station codes. Y means yes.</p>
    <textarea class="field area" data-focus="data-paste" data-field="data-paste" placeholder="Paste tab-separated Excel here">${esc(ui.dataPaste)}</textarea>
    <button type="button" class="btn primary block" data-act="load-paste">Load pasted data</button>
  </div>` : "";
  return `<div class="stack">
    <section class="card">
      <h2>Save / load</h2>
      <p class="muted">Who is in, skills, pins, and the last rota save on this phone as you change them. Save a file as well — phones sometimes clear site data.</p>
      <button type="button" class="btn primary block" data-act="save-file">Save data file</button>
      <button type="button" class="btn block" data-act="load-file">Load data file</button>
      <input id="file-input" type="file" accept="application/json,.json" hidden>
      <button type="button" class="btn block" data-act="toggle-paste">Paste from Excel</button>
      ${paste}
      ${statusLine(ui.dataMsg, ui.dataTone)}
    </section>
    <section class="card">
      <h2>How to use</h2>
      <ol class="help">
        <li>Who is in — set who is in, who is off, and any S1–S3 blocks. This list is the same for every day. You change it yourself before each solve.</li>
        <li>In cycles to T1, T2, then T3. That is how many sessions they train, not which session. Solve picks the sessions. The trainee is not left on the job. A qualified person still covers it, and the training job shows at the top and in the spare box.</li>
        <li>Rota — tap Mon to Fri, then Solve rotation. That fills only the day you selected. Change Who is in, tap the next day, and solve again. You can build the whole week in one sitting.</li>
        <li>If someone calls in sick, mark them Off and clear any training. Then tap Cover absence. It only moves people who have to move to cover every job, and it keeps three-job days where it can. A small dot marks a name that changed.</li>
        <li>Solve aims for three different jobs and still covers every station. Later days look at the week, but it will not spoil the day’s rotation just to move one person onto a new job.</li>
        <li>Tap a slot to pin a name, or copy the operator sheet in Excel and paste it onto the rota. A star is a pin. Reshuffle tries another mix. Back returns to the previous one.</li>
        <li>Week shows fairness from the Monday to Friday rotas. You do not need to confirm a day. Tap a name to see their jobs, most sessions first, then the jobs they have not been on.</li>
        <li>Cover shows thin stations. Train suggests who to teach so more people can rotate. Changes save on this phone. Save a file if you want a backup. Nothing is uploaded.</li>
      </ol>
      <p class="muted gap">On iPhone: Share, then Add to Home Screen. On Android: the browser menu, then Add to Home screen. It then opens full screen, like an app.</p>
      <p class="muted">This page uses the bundled team from 25 Aug 2026, including training marks, exclusions, and the week archive. After you change it, this browser keeps your copy.</p>
    </section>
    <button type="button" class="btn danger block" data-act="reset">${ui.resetArmed ? "Tap again to confirm" : (state.zoneId === "trim-4" ? "Reset to bundled team" : "Clear this zone")}</button>
  </div>`;
}

function viewHelp() {
  const steps = [
    ["1. Who is in", "Open Team. Tap a name to set In or Off. Off means they are not here today. S1, S2 or S3 means they cannot do that session."],
    ["2. Training", "Tap In again for T1, T2 or T3. That is how many sessions they train, not which one. The app picks the sessions. They are not left on the job alone."],
    ["3. Skills", "A green tick means they can do that job. A red cross means they are qualified but not to be used. T means they are learning it."],
    ["4. Solve the day", "Open Rota. Tap Mon to Fri, then Solve rotation. Change who is in, tap the next day, and solve again. Do the whole week this way."],
    ["5. Someone calls in sick", "Mark them Off. Set any T1, T2 or T3 back to In. Tap Cover absence. It keeps people where they are and fills the gaps. A small dot shows a name that moved."],
    ["6. Change a name", "Tap a slot and pick a name. A star means that seat is pinned. Paste names from the Excel sheet if you want. Reshuffle tries another mix. Back goes to the one before."],
    ["7. Week, Cover and Train", "Week shows how often each person has done each job. Cover shows jobs with too few people. Train suggests who to teach."],
    ["8. Saving", "Use the Zone list at the top. Trim 4 is already loaded. Tap New to add a zone, then put that zone’s team in on Data or Team. Each zone keeps its own data. Changes save on this phone. On Data, use Save file if you want a backup. Nothing is sent anywhere."],
  ];
  return `<div class="stack"><section class="card"><h2>How to use</h2><p class="muted">Short steps. Start at Team, then Rota.</p></section>${steps.map(([title, body]) => `<section class="card"><h2>${esc(title)}</h2><p class="muted">${esc(body)}</p></section>`).join("")}</div>`;
}

function teamNote(text, tone) {
  ui.teamMsg = text;
  ui.teamTone = tone || "";
}

function dataNote(text, tone) {
  ui.dataMsg = text;
  ui.dataTone = tone || "";
}

function onClick(event) {
  const button = event.target.closest("[data-act]");
  if (!button) return;
  const act = button.dataset.act;
  if (act === "stop") {
    event.stopPropagation();
    return;
  }
  if (act === "tab") {
    state.tab = button.dataset.tab;
    ui.picker = null;
    ui.confirmOpen = false;
    render();
    return;
  }
  if (act === "zone-new") {
    ui.zoneOpen = !ui.zoneOpen;
    ui.zoneMsg = "";
    render();
    return;
  }
  if (act === "zone-add") {
    const result = addZone(ui.zoneName);
    if (result === "empty") ui.zoneMsg = "Type a zone name.";
    else if (result === "dup") ui.zoneMsg = "That zone is already there.";
    if (result !== "ok") render();
    return;
  }
  if (act === "dismiss-hint") {
    try { localStorage.setItem(KEY_HINT, "0"); } catch { /* ignore */ }
    state.hintOn = false;
    render();
    return;
  }
  if (act === "day") {
    selectDay(button.dataset.day);
    return;
  }
  if (act === "solve") {
    if (!ui.solving) runSolve();
    return;
  }
  if (act === "cover") {
    if (!ui.solving) runCover();
    return;
  }
  if (act === "back") {
    goBack();
    return;
  }
  if (act === "clear") {
    clearResult();
    return;
  }
  if (act === "slot") {
    ui.picker = { station: button.dataset.station, shift: Number(button.dataset.shift) };
    ui.confirmOpen = false;
    render();
    return;
  }
  if (act === "close-picker") {
    ui.picker = null;
    render();
    return;
  }
  if (act === "pin") {
    pinPerson(button.dataset.name);
    return;
  }
  if (act === "clear-slot") {
    clearSlot();
    return;
  }
  if (act === "open-confirm") {
    ui.confirmDate = I(new Date());
    ui.confirmOpen = true;
    ui.picker = null;
    render();
    return;
  }
  if (act === "close-confirm") {
    ui.confirmOpen = false;
    render();
    return;
  }
  if (act === "confirm") {
    confirmRotation();
    return;
  }
  if (act === "copy-excel") {
    const board = boardNow();
    copyText(ue(board.stations, board.result), "Copied — paste into Excel beside the station codes.", "Copy blocked. Select the table instead.");
    return;
  }
  if (act === "copy-message") {
    const board = boardNow();
    copyText(de(board.stations, board.result, board.stats.extra), "Copied — paste into a message.", "Copy blocked. Select the table instead.");
    return;
  }
  if (act === "team-view") {
    ui.teamView = button.dataset.view;
    render();
    return;
  }
  if (act === "sessions") {
    const index = Number(button.dataset.i);
    update((data) => {
      const person = data.operators[index];
      if (!person.reg || person.offline) {
        person.reg = true;
        person.offline = false;
        person.trainSessions = 0;
      } else if (person.trainSessions === 1) person.trainSessions = 2;
      else if (person.trainSessions === 2) person.trainSessions = 3;
      else if (person.trainSessions === 3) person.trainSessions = 0;
      else person.trainSessions = 1;
    });
    return;
  }
  if (act === "flag") {
    const index = Number(button.dataset.i);
    const key = button.dataset.k;
    update((data) => {
      data.operators[index][key] = !data.operators[index][key];
    });
    return;
  }
  if (act === "skill") {
    const hold = skillHold && Date.now() - skillHold.at < 1000 ? skillHold : null;
    applySkill(button, hold);
    return;
  }
  if (act === "add-person") {
    const name = ui.newPerson.trim();
    if (!name) {
      teamNote("Type a name first.", "err");
      render();
      return;
    }
    if (state.data.operators.some((person) => person.name.toLowerCase() === name.toLowerCase())) {
      teamNote("That name is already on the team.", "err");
      render();
      return;
    }
    update((data) => {
      const quals = {};
      for (const station of data.stations) quals[station] = false;
      data.operators.push({
        name,
        reg: true,
        offline: false,
        b1: false,
        b2: false,
        b3: false,
        quals,
        blocked: {},
        training: {},
        trainSessions: 0,
      });
    });
    ui.newPerson = "";
    teamNote(`${name} added. Set their skills in the matrix.`, "ok");
    render();
    return;
  }
  if (act === "add-station") {
    const code = ui.newStation.trim();
    if (!code) {
      teamNote("Type a station code first.", "err");
      render();
      return;
    }
    if (state.data.stations.includes(code)) {
      teamNote("That station is already on the list.", "err");
      render();
      return;
    }
    update((data) => {
      data.stations.push(code);
      for (const person of data.operators) person.quals[code] = false;
    });
    ui.newStation = "";
    teamNote(`Station ${code} added.`, "ok");
    render();
    return;
  }
  if (act === "remove-person") {
    const index = Number(ui.removeOp);
    if (!Number.isInteger(index) || !state.data.operators[index]) {
      teamNote("Choose an operator to remove.", "err");
      render();
      return;
    }
    const name = state.data.operators[index].name;
    update((data) => {
      data.operators.splice(index, 1);
      data.pins = data.pins.filter((pin) => pin.operator !== name);
    });
    ui.removeOp = "";
    teamNote(`Removed ${name}.`, "ok");
    render();
    return;
  }
  if (act === "remove-station") {
    if (!ui.removeStn) {
      teamNote("Choose a station to remove.", "err");
      render();
      return;
    }
    const code = ui.removeStn;
    update((data) => {
      data.stations = data.stations.filter((station) => station !== code);
      data.pins = data.pins.filter((pin) => pin.station !== code);
    });
    ui.removeStn = "";
    teamNote("Station removed.", "ok");
    render();
    return;
  }
  if (act === "train-go") {
    const name = button.dataset.name;
    const station = button.dataset.station;
    const training = button.dataset.training === "1";
    update((data) => {
      const person = data.operators.find((item) => item.name === name);
      if (!person) return;
      if (training) {
        person.quals[station] = true;
        person.training[station] = false;
        person.blocked[station] = false;
      } else person.training[station] = true;
    });
    return;
  }
  if (act === "train-hide") {
    const key = `${button.dataset.name}|${button.dataset.station}`;
    update((data) => {
      data.dismissedSuggestions[key] = true;
    });
    return;
  }
  if (act === "train-show") {
    update((data) => {
      data.dismissedSuggestions = {};
    });
    return;
  }
  if (act === "week-name") {
    ui.weekOpen = ui.weekOpen === button.dataset.name ? null : button.dataset.name;
    render();
    return;
  }
  if (act === "save-file") {
    const blob = new Blob([JSON.stringify(state.data, null, 2)], { type: "application/json" });
    const link = document.createElement("a");
    link.href = URL.createObjectURL(blob);
    link.download = `rotation_data_${I(new Date())}.json`;
    link.click();
    URL.revokeObjectURL(link.href);
    dataNote("Save dialog opened.", "ok");
    render();
    return;
  }
  if (act === "load-file") {
    document.getElementById("file-input").click();
    return;
  }
  if (act === "toggle-paste") {
    ui.dataPasteOpen = !ui.dataPasteOpen;
    render();
    return;
  }
  if (act === "load-paste") {
    try {
      const parsed = le(ui.dataPaste);
      const next = ze();
      next.operators = parsed.operators;
      next.stations = parsed.stations;
      next.weekHistory = state.data.weekHistory;
      next.weekArchive = state.data.weekArchive;
      next.avoidYesterdayEnabled = state.data.avoidYesterdayEnabled;
      next.customLabels = state.data.customLabels;
      next.dismissedSuggestions = state.data.dismissedSuggestions;
      next.pins = [];
      replaceData(next);
      dataNote(`Loaded ${parsed.operators.length} operators.`, "ok");
      render();
    } catch (err) {
      dataNote(err instanceof Error ? err.message : "Could not read that paste.", "err");
      render();
    }
    return;
  }
  if (act === "reset") {
    if (ui.resetArmed) {
      clearTimeout(resetTimer);
      ui.resetArmed = false;
      resetSeed();
      dataNote(state.zoneId === "trim-4" ? "Reset to the bundled team." : "Cleared this zone.", "ok");
      render();
    } else {
      ui.resetArmed = true;
      clearTimeout(resetTimer);
      resetTimer = setTimeout(() => {
        ui.resetArmed = false;
        if (state.tab === "data") render();
      }, 4000);
      render();
    }
  }
}

function onChange(event) {
  const el = event.target;
  if (el.dataset && el.dataset.act === "avoid") {
    update((data) => { data.avoidYesterdayEnabled = el.checked; });
    return;
  }
  if (el.dataset && el.dataset.act === "issues") {
    ui.issuesOnly = el.checked;
    render();
    return;
  }
  if (el.dataset && el.dataset.field === "zone") {
    switchZone(el.value);
    return;
  }
  if (el.dataset && el.dataset.field === "remove-op") {
    ui.removeOp = el.value;
    return;
  }
  if (el.dataset && el.dataset.field === "remove-stn") {
    ui.removeStn = el.value;
    return;
  }
  if (el.id === "file-input") {
    const file = el.files && el.files[0];
    el.value = "";
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const parsed = JSON.parse(String(reader.result));
        if (!parsed || !parsed.operators || !parsed.stations) throw new Error("Not a rotation file");
        replaceData(parsed);
        dataNote("Loaded.", "ok");
        render();
      } catch (err) {
        dataNote(err instanceof Error ? err.message : "Could not load that file.", "err");
        render();
      }
    };
    reader.readAsText(file);
  }
}

function onInput(event) {
  const el = event.target;
  const field = el.dataset && el.dataset.field;
  if (!field) return;
  snapFocus();
  if (field === "team-query") {
    ui.teamQuery = el.value;
    render();
    return;
  }
  if (field === "new-person") ui.newPerson = el.value;
  else if (field === "new-station") ui.newStation = el.value;
  else if (field === "data-paste") ui.dataPaste = el.value;
  else if (field === "confirm-date") ui.confirmDate = el.value;
  else if (field === "zone-name") ui.zoneName = el.value;
  else if (field === "op-name") {
    const index = Number(el.dataset.i);
    if (state.data.operators[index]) state.data.operators[index].name = el.value;
    state.storageOk = Y(state.data);
  }
}

function onPaste(event) {
  if (state.tab !== "rota") return;
  if (event.target.closest("textarea, input, select")) return;
  const text = event.clipboardData.getData("text/plain") || event.clipboardData.getData("text");
  if (!text || !text.trim()) return;
  const slot = event.target.closest("[data-act='slot']");
  const inRota = slot || event.target.closest("[data-paste='rota']");
  if (!inRota && !ui.picker) return;
  event.preventDefault();
  if (slot) pasteRota(text, slot.dataset.station, Number(slot.dataset.shift));
  else if (ui.picker && !text.includes("\t") && !text.includes("\n") && !text.includes("·")) pasteRota(text, ui.picker.station, ui.picker.shift);
  else pasteRota(text, "", 0);
}

async function copyText(text, ok, fail) {
  try {
    await navigator.clipboard.writeText(text);
    setMsg(ok, "ok");
  } catch {
    setMsg(fail, "err");
  }
  render();
}

document.addEventListener("click", onClick);
let skillLock = 0;
let skillHold = null;
function pinSkillScroll(scroller, top, left) {
  const until = performance.now() + 500;
  const restore = () => {
    if (!scroller.isConnected) return;
    if (scroller.scrollTop !== top) scroller.scrollTop = top;
    if (scroller.scrollLeft !== left) scroller.scrollLeft = left;
  };
  const onScroll = () => {
    if (performance.now() > until) {
      scroller.removeEventListener("scroll", onScroll);
      return;
    }
    restore();
  };
  scroller.addEventListener("scroll", onScroll);
  const tick = () => {
    if (performance.now() > until || !scroller.isConnected) {
      scroller.removeEventListener("scroll", onScroll);
      return;
    }
    restore();
    requestAnimationFrame(tick);
  };
  tick();
}
function applySkill(cell, hold) {
  const now = Date.now();
  if (now < skillLock) return;
  skillLock = now + 400;
  const scroller = cell.closest(".scroll");
  const top = hold ? hold.top : scroller ? scroller.scrollTop : 0;
  const left = hold ? hold.left : scroller ? scroller.scrollLeft : 0;
  const index = Number(cell.dataset.i);
  const station = cell.dataset.station;
  const person = state.data.operators[index];
  if (!person || !station) return;
  ee(person, station);
  const ok = Y(state.data);
  state.storageOk = ok;
  if (!ok) {
    render();
    if (scroller) pinSkillScroll(scroller, top, left);
    return;
  }
  const kind = j(person, station);
  cell.innerHTML = mark(kind);
  cell.setAttribute("aria-label", `${person.name} ${station}: ${kind}`);
  if (scroller) pinSkillScroll(scroller, top, left);
}
document.addEventListener("pointerdown", (event) => {
  const cell = event.target.closest && event.target.closest("[data-act='skill']");
  if (!cell) return;
  const scroller = cell.closest(".scroll");
  skillHold = scroller ? { top: scroller.scrollTop, left: scroller.scrollLeft, at: Date.now() } : null;
}, true);
document.addEventListener("touchstart", (event) => {
  const cell = event.target.closest && event.target.closest("[data-act='skill']");
  if (!cell) {
    skillTouch = null;
    return;
  }
  const point = event.changedTouches[0];
  const scroller = cell.closest(".scroll");
  skillTouch = {
    x: point.clientX,
    y: point.clientY,
    cell,
    top: scroller ? scroller.scrollTop : 0,
    left: scroller ? scroller.scrollLeft : 0,
    moved: false,
  };
}, { passive: true });
let skillTouch = null;
document.addEventListener("touchmove", (event) => {
  if (!skillTouch || skillTouch.moved) return;
  const point = event.changedTouches[0];
  if (Math.abs(point.clientX - skillTouch.x) > 8 || Math.abs(point.clientY - skillTouch.y) > 8) skillTouch.moved = true;
}, { passive: true });
document.addEventListener("touchend", (event) => {
  const held = skillTouch;
  skillTouch = null;
  if (!held || held.moved || !held.cell.isConnected) return;
  event.preventDefault();
  applySkill(held.cell, held);
}, { passive: false, capture: true });
document.addEventListener("change", onChange);
document.addEventListener("input", onInput);
document.addEventListener("paste", onPaste);
document.addEventListener("focusout", (event) => {
  const el = event.target;
  if (!el.dataset || el.dataset.field !== "op-name") return;
  const index = Number(el.dataset.i);
  const person = state.data.operators[index];
  if (!person) return;
  const prev = person.name;
  const name = prev.trim() || "Operator";
  if (prev === name) return;
  update((data) => {
    const row = data.operators[index];
    if (!row) return;
    if (prev !== name) {
      for (const pin of data.pins) if (pin.operator === prev) pin.operator = name;
    }
    row.name = name;
  });
});
document.addEventListener("keydown", (event) => {
  if (event.key === "Escape") {
    if (ui.picker || ui.confirmOpen) {
      ui.picker = null;
      ui.confirmOpen = false;
      render();
    }
  }
});

hydrate();

</script>
